---
kind: Service
apiVersion: v1
metadata:
  name: nginx-deployment
  namespace: app
  labels:
    app: nginx
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: app
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      serviceAccountName: cloudgeeks-secrets
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "nginx-deployment-aws-secrets"
      containers:
        - name: nginx-deployment
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
          # Consume the synced Kubernetes Secret as environment variables. The
          # sync only happens because a pod mounts the CSI volume - the
          # SecretProviderClass alone does not create the Secret.
          env:
            - name: SECRET_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eks-demo-secret
                  key: username
            - name: SECRET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eks-demo-secret
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
