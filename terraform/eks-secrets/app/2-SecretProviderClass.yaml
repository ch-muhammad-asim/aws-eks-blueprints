###############################################################################
# SecretProviderClass - what to fetch, and what to sync into a Kubernetes Secret
#
# objects       : the AWS Secrets Manager entries to mount as files
# secretObjects : optional mirror into a native Kubernetes Secret, which is what
#                 lets the workload consume values as environment variables
###############################################################################
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: nginx-deployment-aws-secrets
  namespace: app
spec:
  provider: aws
  parameters:
    # Opt in to EKS Pod Identity. The AWS provider defaults to IRSA, and without
    # this it looks for a web-identity token that Pod Identity never issues.
    usePodIdentity: "true"
    objects: |
      - objectName: "eks-demo-secret"
        objectType: "secretsmanager"
        # jmesPath pulls individual keys out of a JSON secret so each becomes
        # its own file, instead of one blob the app has to parse.
        jmesPath:
          - path: username
            objectAlias: username
          - path: password
            objectAlias: password
  secretObjects:
    - secretName: eks-demo-secret
      type: Opaque
      data:
        - objectName: username
          key: username
        - objectName: password
          key: password
